apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
  namespace: thundertech
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - www.thundertech.com.br
    secretName: thundertech-tls
  rules:
  - host: www.thundertech.com.br
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx
            port:
              number: 80